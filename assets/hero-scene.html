<style>
@keyframes ledFlick{0%,18%,22%,24%,61%,100%{opacity:1}19%,21%,23%{opacity:.18}62%,70%{opacity:.12}71%,72%{opacity:1}73%,74%{opacity:.2}}
@keyframes ledGlow{0%,18%,24%,61%,100%{opacity:1}19%,23%,62%,74%{opacity:.05}}

.ledglow{animation:ledGlow 7s steps(1) infinite}

.steam{animation:steam 2.4s steps(6) infinite}.st2{animation-delay:.8s}.st3{animation-delay:1.6s}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-48px)}}
.scroll{animation:scroll 14s steps(48) infinite}.s2{animation-duration:11s}

.win{animation:win 5s steps(1) infinite}

.star{animation:star 9s linear infinite}
@keyframes lampf{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.6}49%{opacity:1}}

@keyframes armB{0%,30%,100%{transform:translate(0,0)}36%,50%{transform:translate(-8px,-11px)}56%{transform:translate(0,0)}}
.armsipA{animation:armA 9s ease-in-out infinite}.armsipB{animation:armB 11s ease-in-out infinite}
@keyframes vapA{0%,61%,89%,100%{opacity:1}62%,88%{opacity:0}}@keyframes vapB{0%,29%,57%,100%{opacity:1}30%,56%{opacity:0}}
.vapsipA{animation:vapA 9s steps(1) infinite}.vapsipB{animation:vapB 11s steps(1) infinite}
.hero-art{position:absolute;top:0;left:0;width:min(100%,1600px);height:100%;display:block}
