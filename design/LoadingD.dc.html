<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شفرة — تحميل: بسيط</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0F12}
.mono{font-family:'JetBrains Mono','IBM Plex Sans Arabic',ui-monospace,monospace}
</style>
</helmet>
<div role="status" aria-label="جاري التحميل" dir="rtl" style="width: 1440px; height: 900px; box-sizing: border-box; background: #0D0F12; color: #F2F3F5; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">
  <img src="../assets/shafra-logo.png" alt="شفرة" width="220" height="134" style="display: block; width: 220px; height: auto">
  <div style="width: 260px; height: 2px; background: #22262D; border-radius: 2px; overflow: hidden; display: flex; justify-content: flex-start">
    <div style="height: 100%; width: {{ w }}%; background: #B8F34A"></div>
  </div>
  <span class="mono" dir="ltr" style="position: absolute; bottom: 48px; right: 64px; font-size: 120px; line-height: 1; color: #1E2228; letter-spacing: -0.04em">{{ num }}</span>
  <span style="position: absolute; bottom: 60px; left: 64px; font-size: 14px; color: #6E7681">شفرة — استوديو برمجة</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  componentDidMount() { const t0 = Date.now(); this.timer = setInterval(() => this.setState({ t: (Date.now() - t0) / 1000 }), 50); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const t = this.state.t % 4;
    const k = Math.max(0, Math.min(1, t / 3));
    const e = 1 - Math.pow(1 - k, 2);
    const p = Math.round(e * 100);
    return { w: String(p), num: String(p).padStart(3, '0') };
  }
}
</script>
</body>
</html>
