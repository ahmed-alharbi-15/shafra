<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  componentDidMount() { const t0 = Date.now(); this.timer = setInterval(() => this.setState({ t: (Date.now() - t0) / 1000 }), 50); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const T = 3.6; const t = this.state.t % (2 * T); const second = t >= T; const u = t % T;
    const swapAt = 1.5;
    const showB = (u >= swapAt) !== second;
    const aO = showB ? 0 : 1, bO = showB ? 1 : 0;
    const N = 160; const px = {};
    for (let i = 0; i < N; i++) {
      const col = i % 16, row = Math.floor(i / 16);
      const h = ((i * 2654435761) >>> 0) % 1000 / 1000;
      const d = (15 - col) / 15 * 0.55 + h * 0.25;
      let on = false, lime = false;
      if (u > 0.8 && u < 1.5) { on = (u - 0.8) / 0.7 > d; lime = on && (u - 0.8) / 0.7 - d < 0.08; }
      else if (u >= 1.5 && u < 2.2) { on = (u - 1.5) / 0.7 < d; lime = on && d - (u - 1.5) / 0.7 < 0.08; }
      px['c' + i] = 'background: ' + (on ? (lime ? '#B8F34A' : '#15181D') : 'transparent');
    }
    return { aO, bO, px };
  }
}
