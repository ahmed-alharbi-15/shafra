<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  componentDidMount() { const t0 = Date.now(); this.timer = setInterval(() => this.setState({ t: (Date.now() - t0) / 1000 }), 50); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const t = this.state.t % 4.6;
    const k = Math.max(0, Math.min(1, t / 2.8));
    const order = []; let seed = 7; for (let i = 0; i < 100; i++) order.push(i);
    for (let i = 99; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; const j = Math.floor(seed / 233280 * (i + 1)); const x = order[i]; order[i] = order[j]; order[j] = x; }
    const shown = Math.floor(k * 100);
    const rank = {}; order.forEach((c, r) => { rank[c] = r; });
    const px = {};
    for (let i = 0; i < 100; i++) {
      const r = rank[i]; const on = r < shown; const edge = r >= shown - 6 && r < shown;
      px['c' + i] = 'background: ' + (on ? (edge ? 'rgba(184,243,74,.55)' : 'transparent') : '#0D0F12');
    }
    const w = Math.max(0, Math.min(1, (t - 2.9) / 0.5));
    return { px, pct: String(Math.round(k * 100)), wordO: w.toFixed(2) };
  }
}
</script>
