        </label>

          <a href="#" style="font-size: 14px; color: {{accent}}">نسيت كلمة المرور؟</a>
        </div>
        <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; color: #FFB547; font-size: 14px">اكتب الإيميل وكلمة المرور.</p></sc-if>
        <button type="submit" style="min-height: 52px; border-radius: 12px; border: 0; background: {{accent}}; color: #0D0F12; font-weight: 600; font-size: 16px; font-family: inherit">دخول</button>
        <a href="Team.dc.html" style="text-align: center; font-size: 14px; color: #9AA1AC">معاينة البوابة بدون دخول ←</a>
      </form>
    </div>
  </section>

</div>
