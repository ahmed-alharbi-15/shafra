<script>
if (Auth.guard({ staff: true })) PortalData.ready.then(function () {
  const D = PortalData;
  const ME = Auth.current();
  if (!ME || !Auth.isStaff(ME)) { location.replace('account.html'); return; }
  const esc = D.esc;
  const isOwner = Auth.can('assignTask', ME);
  function visibleTasks() { return Auth.can('viewAllTasks', ME) ? D.tasks : D.tasks.filter((t) => !t.assignee || t.assignee === ME.id); }
  const state = { status: 'all', assignee: null, open: {}, drafts: {} };

  const pillStyle = (on) => on
    ? 'display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 99px; font-size: 14px; font-weight: 600; border: 1px solid var(--accent); background: var(--accent); color: #0D0F12; cursor: pointer'
    : 'display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 99px; font-size: 14px; font-weight: 500; border: 1px solid #333943; background: transparent; color: #D7DBE1; cursor: pointer';

  function updateCounts() {
    document.getElementById('tab-tasks-count').textContent = String(visibleTasks().length);
    document.getElementById('tab-people-count').textContent = String(D.people.length);
    document.getElementById('tab-money-count').textContent = String(D.moneyEntries.length);
  }

  function renderStats() {
    const vt = visibleTasks();
    const allItems = vt.reduce((n, t) => n + t.items.length, 0);
    const doneItems = vt.reduce((n, t) => n + t.items.filter((i) => i.done).length, 0);
    const complete = vt.filter((t) => D.statusOf(t) === 'done').length;
    const cards = [
      ['المهام المفتوحة', String(vt.length - complete)],
      ['الأعمال المنجزة', doneItems + '<span style="color:#6E7681;font-size:18px"> / ' + allItems + '</span>'],
      ['المهام المكتملة', String(complete)],
      ['الموظفين', String(D.people.length)]
    ];
    document.getElementById('task-stats').innerHTML = cards.map(function (c) {
      return '<div class="stat" style="padding:18px 20px;background:#15181D;border:1px solid #262A31;border-radius:14px;display:flex;flex-direction:column;gap:6px">' +
        '<span style="color:#9AA1AC;font-size:13px">' + c[0] + '</span>' +
        '<span class="mono" style="font-size:28px">' + c[1] + '</span></div>';
    }).join('');
  }

  function scopedTasks() {
    return visibleTasks().filter((t) => !state.assignee || t.assignee === state.assignee);
  }

  function renderClearAssignee() {
    const btn = document.getElementById('clear-assignee');
    if (state.assignee) {
      btn.style.display = 'inline-flex';
      document.getElementById('clear-assignee-label').textContent = 'مهام: ' + ((D.byId(state.assignee) || {}).name || '');
    } else {
      btn.style.display = 'none';
    }
  }

  function renderStatusFilters() {
    const scoped = scopedTasks();
    const defs = [
      { id: 'all', label: 'الكل' }, { id: 'new', label: 'جديدة' }, { id: 'doing', label: 'قيد التنفيذ' }, { id: 'done', label: 'مكتملة' }
    ];
    document.getElementById('status-filters').innerHTML = defs.map(function (f) {
      const count = f.id === 'all' ? scoped.length : scoped.filter((t) => D.statusOf(t) === f.id).length;
      const on = state.status === f.id;
      return '<button type="button" data-status="' + f.id + '" aria-pressed="' + on + '" style="' + pillStyle(on) + '">' + f.label +
        ' <span class="mono" style="font-size:12px;opacity:.75">' + count + '</span></button>';
    }).join('');
  }

  function renderTasks() {
    const scoped = scopedTasks().filter((t) => state.status === 'all' || D.statusOf(t) === state.status);
    const list = document.getElementById('task-list');
    if (scoped.length === 0) {
      list.innerHTML = '<p style="margin:24px 0;text-align:center;color:#9AA1AC">' + (visibleTasks().length === 0 ? (isOwner ? 'ما فيه مهام للحين. اضغط «مهمة جديدة» وأضف أول مهمة.' : 'ما فيه مهام لك للحين. لما يضيف المالك مهمة تطلع هنا.') : 'ما فيه مهام بهذي الحالة.') + '</p>';
      return;
    }
    list.innerHTML = scoped.map(function (t, ti) {
      const doneCount = t.items.filter((i) => i.done).length;
      const total = t.items.length;
      const pct = total ? Math.round((doneCount / total) * 100) : 0;
      const st = D.statusOf(t);
      const owner = D.byId(t.assignee) || { name: 'مفتوحة للجميع', initial: '؟' };
      const canEdit = isOwner || t.assignee === ME.id;
      let controlsHtml = '';
      if (!t.assignee && Auth.can('claimTask', ME)) {
        controlsHtml += '<div style="border-top:1px solid #22262D;padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-size:14px;color:#B4BAC4">المهمة مفتوحة، أي موظف يقدر ياخذها.</span><button type="button" data-claim="' + t.id + '" style="min-height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:#0D0F12;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer">خذ المهمة</button></div>';
      }
      if (isOwner) {
        const opts = '<option value=""' + (t.assignee ? '' : ' selected') + '>مفتوحة للجميع</option>' + D.people.map((p) => '<option value="' + p.id + '"' + (p.id === t.assignee ? ' selected' : '') + '>' + esc(p.name) + ' (' + esc(p.title) + ')</option>').join('');
        controlsHtml += '<div style="border-top:1px solid #22262D;padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#B4BAC4">المسؤول عن المهمة<select data-assign="' + t.id + '" style="min-height:40px;padding:0 10px;border-radius:10px;border:1px solid #333943;background:#0D0F12;color:#F2F3F5;font-family:inherit;font-size:14px">' + opts + '</select></label></div>';
      }
      const open = !!state.open[t.id];
      const itemsHtml = t.items.map(function (it, idx) {
        const textStyle = it.done ? 'font-size:15px;color:#6E7681;text-decoration:line-through' : 'font-size:15px;color:#E4E7EB';
        return '<label class="work-row" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border-radius:10px;cursor:pointer">' +
          '<input type="checkbox" ' + (it.done ? 'checked' : '') + (canEdit ? '' : ' disabled') + ' data-task="' + t.id + '" data-item="' + idx + '" style="width:18px;height:18px;margin:0">' +
          '<span style="' + textStyle + '">' + esc(it.text) + '</span></label>';
      }).join('');
      return '<article class="pop" style="animation-delay:' + (ti * 0.07).toFixed(2) + 's;background:#15181D;border:1px solid #262A31;border-radius:16px;overflow:hidden">' +
        '<div style="padding:20px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:16px">' +
        '<button type="button" data-toggle="' + t.id + '" aria-expanded="' + open + '" aria-label="إظهار أو إخفاء قائمة الأعمال" style="width:44px;height:44px;flex:none;border-radius:10px;border:1px solid #333943;background:transparent;color:#D7DBE1;display:inline-flex;align-items:center;justify-content:center">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="' + (open ? 'transform:rotate(180deg)' : '') + '"><path d="M6 9l6 6 6-6"></path></svg></button>' +
        '<div style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:6px">' +
        '<div class="tags" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">' +
        '<span style="font-size:12px;padding:3px 10px;border-radius:99px;background:#1E2228;color:#C9CED6">' + esc(t.project) + '</span>' +
        '<span style="font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid ' + D.statusColor[st] + ';color:' + D.statusColor[st] + '">' + D.statusLabel[st] + '</span>' +
        '<span style="font-size:12px;color:' + D.prioColor[t.priority] + '">أولوية ' + t.priority + '</span></div>' +
        '<h2 style="margin:0;font-size:19px;font-weight:600">' + esc(t.title) + '</h2></div>' +
        '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">' +
        '<div style="display:flex;flex-direction:column;gap:6px;width:150px">' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:#9AA1AC"><span>الإنجاز</span><span class="mono">' + doneCount + '/' + total + '</span></div>' +
        '<div style="height:6px;border-radius:99px;background:#262A31;overflow:hidden"><div class="bar" style="height:100%;width:' + pct + '%;background:var(--accent);border-radius:99px"></div></div></div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
        '<span style="width:32px;height:32px;border-radius:9px;background:#1E2228;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:14px">' + owner.initial + '</span>' +
        '<span style="display:flex;flex-direction:column"><span style="font-size:13px;font-weight:500">' + esc(owner.name) + '</span><span style="font-size:12px;color:#9AA1AC">التسليم: ' + (D.isOverdue(t) ? '<span style="color:#FFB547">' + D.formatDue(t.due) + ' (متأخرة)</span>' : D.formatDue(t.due)) + '</span></span></div></div></div>' +
        controlsHtml +
        (open ? '<div style="border-top:1px solid #22262D;padding:14px 22px 18px;display:flex;flex-direction:column;gap:4px">' +
          '<p style="margin:0 0 6px;color:#9AA1AC;font-size:13px">قائمة الأعمال</p>' + itemsHtml +
          '<div style="display:' + (canEdit ? 'flex' : 'none') + ';gap:8px;padding-top:8px;flex-wrap:wrap">' +
          '<label style="flex:1 1 220px;display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">عمل جديد تحت المهمة</span>' +
          '<input type="text" data-draft="' + t.id + '" value="' + esc(state.drafts[t.id] || '') + '" placeholder="أضف عمل جديد تحت هذي المهمة…" style="flex:1;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #333943;background:#0F1215;color:#F2F3F5;font-size:14px"></label>' +
          '<button type="button" data-add="' + t.id + '" style="min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--accent);color:#0D0F12;font-weight:600;font-size:14px">إضافة</button></div></div>' : '') +
        '</article>';
    }).join('');
  }

  function renderAll() {
    renderStats();
    renderClearAssignee();
    renderStatusFilters();
    renderTasks();
  }

  document.addEventListener('click', function (e) {
    const toggleBtn = e.target.closest('[data-toggle]');
    if (toggleBtn) {
      const id = toggleBtn.getAttribute('data-toggle');
      state.open[id] = !state.open[id];
      renderTasks();
      return;
    }
    const addBtn = e.target.closest('[data-add]');
    if (addBtn) {
      const id = addBtn.getAttribute('data-add');
      const txt = (state.drafts[id] || '').trim();
      if (!txt || addBtn.disabled) return;
      addBtn.disabled = true;
      D.addItem(id, txt).then(function (t) {
        addBtn.disabled = false;
        if (!t) return;
        state.drafts[id] = '';
        renderAll();
      });
      return;
    }
    const statusBtn = e.target.closest('[data-status]');
    if (statusBtn) { state.status = statusBtn.getAttribute('data-status'); renderStatusFilters(); renderTasks(); return; }
    if (e.target.closest('#clear-assignee')) { state.assignee = null; renderAll(); return; }
  });

  document.addEventListener('change', function (e) {
    const cb = e.target.closest('input[type=checkbox][data-task]');
    if (cb) {
      const id = cb.getAttribute('data-task');
      const idx = Number(cb.getAttribute('data-item'));
      cb.disabled = true;
      D.setItemDone(id, idx, cb.checked).then(function () { renderAll(); });
      return;
    }
    const draft = e.target.closest('input[data-draft]');
    if (draft) { state.drafts[draft.getAttribute('data-draft')] = draft.value; }
  });

  // ---- people ----
  const ROLE_OPTS = ['admin', 'moderator', 'employee', 'client'];

  function renderPeople() {
    document.getElementById('people-grid').innerHTML = D.people.map(function (p, pi) {
      const taskCount = D.tasks.filter((t) => t.assignee === p.id && D.statusOf(t) !== 'done').length;
      const badgeStyle = 'font-size:12px;padding:3px 10px;border-radius:99px;' + (p.roleKey === 'owner' ? 'background:var(--accent);color:#0D0F12;font-weight:600' : 'border:1px solid #333943;color:#C9CED6');
      const chip = (x) => '<span class="mono" style="font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid #333943;color:#C9CED6">' + esc(x) + '</span>';
      const domains = p.domains.length ? p.domains.map((x) => '<span style="font-size:12px;padding:4px 10px;border-radius:99px;background:#1E2228;color:#D7DBE1">' + esc(x) + '</span>').join('') : '<span style="font-size:13px;color:#6E7681">ما حدد مجاله للحين</span>';
      const langs = p.languages.map(chip).join('');
      const phone = p.phone ? '<span dir="ltr" class="mono" style="font-size:13px;color:#B4BAC4;text-align:right">' + esc(p.phone) + '</span>' : '';
      return '<article class="pop hov-card" style="animation-delay:' + (pi * 0.08).toFixed(2) + 's;padding:24px;background:#15181D;border:1px solid #262A31;border-radius:16px;display:flex;flex-direction:column;gap:16px">' +
        '<div style="display:flex;align-items:center;gap:14px">' +
        '<span class="float" style="width:52px;height:52px;border-radius:14px;background:#1E2228;border:1px solid #333943;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;font-weight:700">' + esc(p.initial) + '</span>' +
        '<div style="display:flex;flex-direction:column;gap:2px;min-width:0">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0;font-size:18px;font-weight:600">' + esc(p.name) + '</h2><span style="' + badgeStyle + '">' + esc(p.title) + '</span></div>' +
        '<span dir="ltr" style="color:#9AA1AC;font-size:13px;text-align:right">' + esc(p.email) + '</span>' + phone + '</div></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px">' + domains + '</div>' +
        '<div dir="ltr" class="chips" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end">' + langs + '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid #22262D;gap:12px">' +
        '<span style="font-size:14px;color:#9AA1AC"><span class="mono" style="color:#F2F3F5">' + taskCount + '</span> مهام مفتوحة</span>' +
        '<div style="display:flex;gap:8px">' +
        '<button type="button" class="ghost" data-show-tasks="' + p.id + '" style="min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #333943;background:transparent;color:#D7DBE1;font-size:14px;font-family:inherit;cursor:pointer">مهامه</button>' +
        '<a href="profile.html?id=' + p.id + '" style="display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:#0D0F12;font-weight:600;font-size:14px;text-decoration:none">الملف</a>' +
        '</div></div></article>';
    }).join('');
    renderRoleManager();
  }

  // إدارة الرتب: Owner بس. يعيّن أدمن / مشرف / موظف لأي حساب مسجّل.
  function renderRoleManager() {
    let box = document.getElementById('role-manager');
    if (!isOwner) { if (box) box.remove(); return; }
    if (!box) {
      box = document.createElement('section');
      box.id = 'role-manager';
      box.style.cssText = 'display:flex;flex-direction:column;gap:14px;padding:24px;background:#15181D;border:1px solid #262A31;border-radius:16px';
      document.getElementById('view-people').appendChild(box);
    }
    const others = Auth.users().filter((u) => u.role !== 'owner');
    const rows = others.length ? others.map(function (u) {
      const opts = ROLE_OPTS.map((r) => '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + Auth.roleLabel(r) + '</option>').join('');
      return '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid #22262D">' +
        '<div style="flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">' + esc(u.name) + '</span>' +
        '<span dir="ltr" style="font-size:13px;color:#9AA1AC;text-align:right">' + esc(u.email) + (u.phone ? ' · ' + esc(u.phone) : '') + '</span></div>' +
        '<select data-role-for="' + u.id + '" aria-label="رتبة ' + esc(u.name) + '" style="min-height:42px;padding:0 12px;border-radius:10px;border:1px solid #333943;background:#0D0F12;color:#F2F3F5;font-family:inherit;font-size:14px">' + opts + '</select></div>';
    }).join('') : '<p style="margin:0;color:#9AA1AC;font-size:14px">ما فيه حسابات ثانية للحين. أي أحد يسجّل من الموقع يطلع هنا، وتختار رتبته.</p>';
    box.innerHTML = '<div style="display:flex;flex-direction:column;gap:4px"><h2 style="margin:0;font-size:20px;font-weight:600">الرتب والصلاحيات</h2>' +
      '<p style="margin:0;color:#9AA1AC;font-size:14px;line-height:1.7">أنتم الاثنين Owner ثابتين. من هنا تعيّن الأدمن والمشرفين والموظفين، والعميل رتبة عادية بدون بوابة.</p></div>' + rows;
  }
  document.addEventListener('change', function (e) {
    const sel = e.target.closest('select[data-role-for]');
    if (!sel) return;
    sel.disabled = true;
    Auth.setRole(ME.id, sel.getAttribute('data-role-for'), sel.value).then(async function (r) {
      if (!r.ok) D.notify(r.error);
      // الموظفين يتغيرون مع الرتب، فنجيب القائمة من جديد
      try { D.people = (await Auth.request('/api/people')).map((u) => D._person(Auth.normalize(u))); } catch (err) {}
      updateCounts(); renderPeople(); renderAll();
    });
  });

  document.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-show-tasks]');
    if (btn) {
      state.assignee = btn.getAttribute('data-show-tasks');
      state.status = 'all';
      showView('tasks');
      renderAll();
    }
  });

  // ---- tabs ----
  function showView(tab) {
    const onTasks = tab === 'tasks';
    document.getElementById('view-tasks').style.display = onTasks ? 'flex' : 'none';
    document.getElementById('view-people').style.display = onTasks ? 'none' : 'flex';
    const tasksBtn = document.getElementById('tab-tasks');
    const peopleBtn = document.getElementById('tab-people');
    tasksBtn.style.background = onTasks ? '#1E2228' : 'transparent';
    tasksBtn.style.color = onTasks ? '#F2F3F5' : '#B4BAC4';
    tasksBtn.style.fontWeight = onTasks ? '600' : '500';
    tasksBtn.setAttribute('aria-current', onTasks ? 'page' : 'false');
    peopleBtn.style.background = onTasks ? 'transparent' : '#1E2228';
    peopleBtn.style.color = onTasks ? '#B4BAC4' : '#F2F3F5';
    peopleBtn.style.fontWeight = onTasks ? '500' : '600';
    peopleBtn.setAttribute('aria-current', onTasks ? 'false' : 'page');
    document.getElementById('bn-tasks').setAttribute('aria-current', onTasks ? 'page' : 'false');
    document.getElementById('bn-people').setAttribute('aria-current', onTasks ? 'false' : 'page');
    if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
  }

  document.getElementById('tab-tasks').addEventListener('click', function () { showView('tasks'); });
  document.getElementById('tab-people').addEventListener('click', function () { showView('people'); });
  document.getElementById('bn-tasks').addEventListener('click', function () { showView('tasks'); });
  document.getElementById('bn-people').addEventListener('click', function () { showView('people'); });

  const assigneeParam = new URLSearchParams(location.search).get('assignee');
  if (assigneeParam && D.byId(assigneeParam)) state.assignee = assigneeParam;


  // ---- مهمة جديدة ----
  const dlg = document.getElementById('task-dialog');
  const newBtn = document.getElementById('new-task-btn');
  newBtn.style.display = isOwner ? 'inline-flex' : 'none';
  newBtn.addEventListener('click', function () {
    if (!isOwner) return;
    document.getElementById('nt-assignee').innerHTML = '<option value="">مفتوحة (أي موظف ياخذها)</option>' + D.people.map((p) => '<option value="' + p.id + '">' + p.name + ' (' + p.title + ')</option>').join('');
    if (state.assignee) document.getElementById('nt-assignee').value = state.assignee;
    document.getElementById('nt-err').style.display = 'none';
    document.getElementById('nt-due').min = new Date().toISOString().slice(0, 10);
    dlg.showModal();
  });
  document.getElementById('nt-cancel').addEventListener('click', function () { dlg.close(); });
  document.getElementById('task-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const title = document.getElementById('nt-title').value.trim();
    const due = document.getElementById('nt-due').value;
    if (!title || !due) { document.getElementById('nt-err').style.display = ''; return; }
    const items = document.getElementById('nt-items').value.split('\n').map((x) => x.trim()).filter(Boolean).map((text) => ({ text, done: false }));
    if (!isOwner) return;
    const submitBtn = e.target.querySelector('button[type=submit]');
    if (submitBtn) submitBtn.disabled = true;
    D.createTask({
      title,
      project: document.getElementById('nt-project').value.trim() || 'عام',
      assignee: document.getElementById('nt-assignee').value || null, due,
      priority: document.getElementById('nt-prio').value, items
    }).then(function (task) {
      if (submitBtn) submitBtn.disabled = false;
      if (!task) return;
      state.open[task.id] = items.length > 0;
      ['nt-title', 'nt-project', 'nt-due', 'nt-items'].forEach((id) => { document.getElementById(id).value = ''; });
      dlg.close();
      state.status = 'all';
      updateCounts(); renderAll(); renderPeople();
    });
  });

  // ---- ياخذ مهمة مفتوحة / الـ Owner يغيّر المسؤول ----
  document.addEventListener('click', function (e) {
    const claim = e.target.closest('[data-claim]');
    if (!claim) return;
    const t = D.tasks.find((x) => x.id === claim.getAttribute('data-claim'));
    if (!t || t.assignee || !Auth.can('claimTask', ME)) return;
    claim.disabled = true;
    D.claim(t.id).then(function () { updateCounts(); renderAll(); renderPeople(); });
  });
  document.addEventListener('change', function (e) {
    const sel = e.target.closest('select[data-assign]');
    if (!sel || !isOwner) return;
    const t = D.tasks.find((x) => x.id === sel.getAttribute('data-assign'));
    if (!t) return;
    sel.disabled = true;
    D.setAssignee(t.id, sel.value || null).then(function () { updateCounts(); renderAll(); renderPeople(); });
  });

  updateCounts();
  renderAll();
  renderPeople();
  showView(location.hash === '#people' ? 'people' : 'tasks');
});
</script>
<script src="js/transition.js"></script>
<script src="js/loading.js"></script>
</body>
</html>
