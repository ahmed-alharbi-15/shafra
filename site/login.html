<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شفرة — دخول بوابة الفريق</title>
<meta name="description" content="دخول بوابة الفريق في شفرة — للأدمن والموظفين فقط.">
<meta name="theme-color" content="#0D0F12">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/shafra-icon.png">
<link rel="apple-touch-icon" href="assets/shafra-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
<script>try{if(sessionStorage.getItem('shafra_loaded'))document.documentElement.classList.add('no-loading');}catch(e){}</script>
<link rel="stylesheet" href="css/transition.css">
<link rel="stylesheet" href="css/loading.css">
</head>
<body>
<div id="site-transition-bar" aria-hidden="true"></div>
<div id="site-transition-dim" aria-hidden="true"></div>
<span id="site-transition-label" class="mono" aria-hidden="true">loading…</span>
<div id="site-loading" role="status" aria-live="polite" aria-label="جاري تحميل شفرة">
  <div class="site-loading-glow" aria-hidden="true"></div>
  <img src="assets/shafra-logo.png" alt="شفرة" width="260" height="158" class="site-loading-logo">
  <div class="site-loading-bar">
    <div class="site-loading-segs">
      <div class="site-loading-track"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="site-loading-fill"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="site-loading-row">
      <span class="site-loading-msgwrap"><span class="mono site-loading-caret-prefix">&gt;</span><span class="msg">نجهّز الكود</span><span class="site-loading-caret"></span></span>
      <span class="mono site-loading-pct" dir="ltr"><span class="pct">0</span>%</span>
    </div>
  </div>
  <div class="site-loading-coffee">
    <svg width="56" height="56" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
      <g class="steam steam-a"><rect x="5" y="1" width="1" height="2" fill="#9AA1AC"></rect><rect x="8" y="0" width="1" height="2" fill="#9AA1AC"></rect></g>
      <g class="steam steam-b"><rect x="6" y="2" width="1" height="2" fill="#9AA1AC"></rect><rect x="9" y="1" width="1" height="2" fill="#9AA1AC"></rect></g>
      <rect x="3" y="5" width="9" height="1" fill="#2A1A10"></rect>
      <rect x="3" y="6" width="9" height="7" fill="#B8F34A"></rect>
      <rect x="4" y="13" width="7" height="1" fill="#B8F34A"></rect>
      <rect x="12" y="7" width="2" height="1" fill="#B8F34A"></rect><rect x="13" y="8" width="1" height="3" fill="#B8F34A"></rect><rect x="12" y="11" width="2" height="1" fill="#B8F34A"></rect>
      <rect x="4" y="7" width="1" height="4" fill="#D4FF7A"></rect>
      <rect x="2" y="14" width="12" height="1" fill="#2A2645"></rect>
    </svg>
    <span>لحظة… نصب القهوة ونجهّز لك الشغل</span>
  </div>
</div>
<div dir="rtl" style="min-height: 100vh">

  <div style="max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex">
    <a href="index.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #B4BAC4; text-decoration: none; font-size: 15px">→ رجوع للموقع</a>
  </div>

  <section class="herobg" style="min-height: 720px; display: flex; align-items: center; justify-content: center; padding: 64px 24px; box-sizing: border-box">
    <div class="rise d2" style="width: min(100%, 440px); padding: 36px; background: #15181D; border: 1px solid #262A31; border-radius: 24px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">
      <img src="assets/shafra-logo.png" alt="شفرة" width="105" height="64" style="display: block; width: 105px; height: 64px; align-self: center">
      <div style="display: flex; flex-direction: column; gap: 6px; text-align: center">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700">بوابة الفريق</h1>
        <p style="margin: 0; color: #9AA1AC; font-size: 15px">للأدمن والموظفين فقط</p>
      </div>
      <form id="login-form" style="display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #B4BAC4">الإيميل
          <input id="f-email" type="email" dir="ltr" autocomplete="username" placeholder="name@shafra.sa" style="min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #333943; background: #0F1215; color: #F2F3F5; font-size: 15px; font-family: inherit; box-sizing: border-box; width: 100%; text-align: right">
        </label>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #B4BAC4">كلمة المرور
          <span style="position: relative; display: flex">
            <input id="f-pw" type="password" dir="ltr" autocomplete="current-password" style="min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #333943; background: #0F1215; color: #F2F3F5; font-size: 15px; font-family: inherit; box-sizing: border-box; width: 100%; padding-left: 52px; text-align: right">
            <button id="toggle-pw" type="button" aria-label="إظهار كلمة المرور" style="position: absolute; left: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; color: #9AA1AC; display: inline-flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </span>
        </label>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
          <label style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: #D7DBE1; cursor: pointer"><input id="f-remember" type="checkbox" checked style="width: 18px; height: 18px; margin: 0">تذكرني</label>
          <a href="#" style="font-size: 14px; color: var(--accent)">نسيت كلمة المرور؟</a>
        </div>
        <p id="f-err" role="alert" style="display: none; margin: 0; color: #FFB547; font-size: 14px">اكتب الإيميل وكلمة المرور.</p>
        <button type="submit" style="min-height: 52px; border-radius: 12px; border: 0; background: var(--accent); color: #0D0F12; font-weight: 600; font-size: 16px; font-family: inherit">دخول</button>
      </form>
    </div>
  </section>

  <footer style="border-top: 1px solid #22262D">
    <div style="max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; color: #8C939E; font-size: 14px">
      <span style="display: flex; align-items: center; gap: 14px"><img src="assets/shafra-logo.png" alt="" width="56" height="34" style="display: block; flex: none; width: 56px; height: 34px; opacity: .7"> مواقع، تطبيقات، داشبورد ومشاريع طلاب</span>
      <span class="mono" dir="ltr">© 2026 Shafra</span>
    </div>
  </footer>
</div>

<script>
  // TODO(backend): لين يجهز سيرفر نايف (FastAPI)، الدخول هنا شكلي فقط —
  // يتحقق من تعبئة الحقلين ويوديك لبوابة الفريق، بدون أي تحقق حقيقي من الهوية.
  (function () {
    const form = document.getElementById('login-form');
    const email = document.getElementById('f-email');
    const pw = document.getElementById('f-pw');
    const err = document.getElementById('f-err');
    const togglePw = document.getElementById('toggle-pw');

    togglePw.addEventListener('click', function () {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      togglePw.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    });

    [email, pw].forEach(function (el) {
      el.addEventListener('input', function () { err.style.display = 'none'; });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!email.value.trim() || !pw.value) {
        err.style.display = '';
        return;
      }
      // TODO(backend): استبدل هذا بطلب POST /api/auth/login حقيقي.
      window.location.href = 'team.html';
    });
  })();
</script>
<script src="js/transition.js"></script>
<script src="js/loading.js"></script>
</body>
</html>
